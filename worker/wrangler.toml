name = "krengbible"
main = "index.js"
compatibility_date = "2026-05-31"
account_id = "a3c32a9275ac5df0061e7913f05ce6c5"

# KV binding — dashboard name is BIBLE_COMMENTARY, code uses COMMENTARY_KV
[[kv_namespaces]]
binding = "COMMENTARY_KV"
id = "5f36020ad8334b02ab9ffcdfa8788c63"

# Crons — see index.js's scheduled() handler, which dispatches on event.cron.
#   0 8  * * *  Daily QT cache-warming.  08:00 UTC gives every timezone (as
#               far out as UTC+14) at least a 2-hour head start before their
#               local midnight for the date it warms.
#   0 16 * * *  Stage tomorrow's VOTD photo so it can be previewed and
#               re-rolled before it goes live.  Noon EDT / 11am EST — crons
#               are UTC-only, so the DST hour is accepted, not corrected.
[triggers]
crons = ["0 8 * * *", "0 16 * * *"]

# Secrets ESV_TOKEN, ANTHROPIC_KEY, ADMIN_SECRET are managed via
# `wrangler secret put NAME` and persist across deploys — not declared here.
#
# The VOTD preview email needs three more, same mechanism:
#   RESEND_KEY        Resend API key
#   VOTD_EMAIL_FROM   sender on a domain verified with Resend, e.g. votd@krengbible.com
#   VOTD_EMAIL_TO     recipient
# Kept as secrets rather than [vars] because this repo is public and the
# recipient is a personal address.  If any is unset the cron still stages the
# photo and simply skips the email — staging must not depend on mail working.
# VOTD_PUBLIC_ORIGIN is optional; set it only if the worker moves to a custom
# domain, since a cron has no request to read its own host from.
